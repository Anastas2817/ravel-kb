# CI: сборка ядра (core + storage + tests) без Qt, матрица платформ и конфигураций.
# UI-слой (Qt 6) собирается отдельным job'ом `ui` — только факт компиляции,
# без прогона (у приложения нет автотестов; ручная проверка — за автором).
#
# MSVC (Windows): warnings-as-errors НЕ включён — системные заголовки nlohmann/json
# дают предупреждения уровня /W4; лечение через /external отложено.
# GCC (Ubuntu): -Wall -Wextra -Werror — свой код должен быть чист; нарушение = красный CI.
# Санитайзеры (ASan+UBSan, отдельный job): ручное индексирование id − 1 по плотным
# векторам — зона повышенного риска off-by-one; санитайзер ловит то, что тесты читают
# как «работает» на отладочной куче.
#
# Покрытие (coverage job): gcovr с гейтом --fail-under-line — порог ратифицирует
# измеренное значение, а не желаемое; поднимать после прогона, не опускать.
#
# clang-tidy (tidy job): пин pip clang-tidy==19.1.0.1 = локальный бинарь
# в .tidy-venv (симметрия с пином clang-format 19.1.5: «у меня зелёное, в CI
# красное» лечится одинаковыми версиями на обеих сторонах).
#
# Fuzz (fuzz job): libFuzzer + ASan/UBSan над JsonStorage::Load и
# Graph::FromSnapshot — ручная валидация снапшота ломается malformed-входами
# чаще, чем штатными путями property-тестов.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  core:
    name: core (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows · MSVC 2022 · Debug"
            os: windows-2022
            generator: "Visual Studio 17 2022"
            extra_flags: "-A x64"
            build_type: Debug
            cxx_flags: ""
          - name: "Windows · MSVC 2022 · Release"
            os: windows-2022
            generator: "Visual Studio 17 2022"
            extra_flags: "-A x64"
            build_type: Release
            cxx_flags: ""
          # clang-cl через тулчейн LLVM из образа windows-2022 (-T clangcl).
          # Дисциплина warnings — та же, что у MSVC-джоба (не -Werror): цель —
          # другой компилятор/стандартная библиотека, а не новые -Werror-ловушки.
          - name: "Windows · clang-cl · Debug"
            os: windows-2022
            generator: "Visual Studio 17 2022"
            extra_flags: "-A x64 -T clangcl"
            build_type: Debug
            cxx_flags: ""
          - name: "Ubuntu · GCC · Debug"
            os: ubuntu-latest
            generator: "Ninja"
            extra_flags: ""
            build_type: Debug
            cxx_flags: "-Wall -Wextra -Werror"
          - name: "Ubuntu · GCC · Release"
            os: ubuntu-latest
            generator: "Ninja"
            extra_flags: ""
            build_type: Release
            cxx_flags: "-Wall -Wextra -Werror"
    # windows-2022 (не latest): на Server 2025 CMake через vswhere не находит VS 2022
    runs-on: ${{ matrix.os }}

    # Через env, а не -DCMAKE_CXX_FLAGS: переменная окружения ПРИБАВЛЯЕТСЯ
    # к флагам по умолчанию, а -DCMAKE_CXX_FLAGS их ЗАМЕНЯЕТ — на MSVC это
    # молча убирает /EHsc (модель исключений) и ломает любой throw → abort.
    env:
      CXXFLAGS: ${{ matrix.cxx_flags }}

    steps:
      - uses: actions/checkout@v7

      # VS-генератор не требует vcvars (в отличие от Ninja из build_dev.bat)
      - name: Configure
        run: >
          cmake -B build -G "${{ matrix.generator }}" ${{ matrix.extra_flags }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRAVEL_BUILD_UI=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  # UI: только сборка. Цель job'а — поймать «у меня собирается, в CI нет»
  # и регрессии компиляции ui/ от правок в core/app (сигнатуры фасада).
  # Qt 6 из apt образа ubuntu-latest (6.4.x) — минимальная версия, под которую
  # обязан собираться код: локально у автора Qt новее, ловить дрейф API
  # здесь, а не у пользователя. -Werror нет намеренно: предупреждения из
  # Qt-заголовков (та же история, что у MSVC-джоба ядра). Тесты не гоняем:
  # ctest-покрытие — job'ами ядра, здесь важен факт линковки ravel.
  ui:
    name: ui build (Ubuntu · Qt 6 · GCC)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # qt6-base-dev — Widgets + CMake-конфиги Qt6; qt6-base-dev-tools —
      # moc/uic для automoc; libgl1-mesa-dev — заголовки OpenGL, без них
      # Qt-конфиг падает на поиске GL при первом configure.
      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRAVEL_BUILD_UI=ON

      - name: Build
        run: cmake --build build --target ravel --parallel

  format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Пин через venv + pip: бинарь совпадает с локальным из VS 2022 (19.1.5).
      # Версии clang-format форматируют по-разному — пин обязателен, иначе
      # «у меня зелёное, в CI красное». apt-вариант не пинится.
      - name: Install clang-format (pinned 19.1.5)
        run: |
          python3 -m venv .fmt-venv
          .fmt-venv/bin/pip install clang-format==19.1.5

      - name: Check formatting
        run: >
          .fmt-venv/bin/clang-format --dry-run --Werror
          $(find core storage app ui tests -name '*.hpp' -o -name '*.cpp')

  architecture:
    name: architecture (ui не включает graph.hpp напрямую)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Инвариант 7 в машинном виде: ui зависит только от фасада app.
      # Транзитивное включение (ui -> controller.hpp -> graph.hpp) разрешено —
      # проверяется только прямое. Срабатывание на этапе 3 = сигнал
      # расширить read-API Controller, а не ослабить проверку.
      - name: Check ui/ direct includes
        run: bash .github/scripts/check_ui_includes.sh

  # Санитайзеры: ручное индексирование id − 1 по плотным векторам — ровно тот
  # код, где off-by-one читается как «работает» на отладочной куче и взрывается
  # у пользователя. ASan ловит выход за границу и use-after-free, UBSan —
  # UB-арифметику и сдвиги. Цена — один лишний прогон тестов.
  sanitizers:
    name: sanitizers (Ubuntu · GCC · ASan+UBSan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Флаги через -D, а не env CXXFLAGS: санитайзеры обязаны дойти и до
      # компиляции, и до линковки (gtest/тесты). env CXXFLAGS в CMake влияет
      # только на compile-шаг; линковка без -fsanitize дала бы «libasan not
      # linked». Замена флагов по умолчанию здесь безопасна: job только GCC.
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DRAVEL_BUILD_UI=OFF
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Покрытие строк core/storage/app + гейт. --coverage = -fprofile-arcs
  # -ftest-coverage (gcov) для компиляции и линковки. Отчёт и гейт — gcovr;
  # фильтр ограничивает отчёт нашими исходниками (без gtest/_deps).
  # Порог 75 — стартовый «не ниже измеренного»: поднимать по итогам прогонов.
  coverage:
    name: coverage (Ubuntu · GCC · gcovr)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install gcovr
        run: python3 -m pip install --user gcovr

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DRAVEL_BUILD_UI=OFF
          -DCMAKE_CXX_FLAGS="--coverage -O0"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Запуск из build/: gcovr по умолчанию ищет .gcda с текущего каталога.
      # Фильтр обёрнут в .*(...).*: паттерн работает при любой семантике
      # сопоставления gcovr (search или fullmatch) — первый прогон с
      # 'core/' отфильтровал все данные («All coverage data is filtered out»,
      # 2026-10-22). Счётчик .gcda — диагностика: если данных нет, это видно
      # сразу, а не из косвенного «0.0%». run: > (folded), не | (literal):
      # строки склеиваются в одну команду — иначе каждая выполняется отдельно
      # (первый красный прогон: gcovr ушёл без фильтров, а --filter=... ронял
      # шаг как «No such file or directory», exit 127).
      - name: Report + gate
        working-directory: build
        run: >
          echo "gcda files: $(find . -name '*.gcda' | wc -l)" &&
          gcovr --root=..
          --filter='.*(core|storage|app)/.*'
          --txt --fail-under-line=85

  # Статический анализ. Пин pip clang-tidy==19.1.0.1 = локальный бинарь
  # в .tidy-venv (правило: компилятор автора ≠ компилятору CI лечится
  # одинаковыми версиями). Конфигурация проверок — .clang-tidy.
  # Только core/storage/app: UI требует Qt-заголовков, тесты — gtest-макросы,
  # оба источника шума, не багов.
  tidy:
    name: clang-tidy (Ubuntu · Clang)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install clang + clang-tidy (pinned 19.1.0.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          python3 -m venv .tidy-venv
          .tidy-venv/bin/pip install clang-tidy==19.1.0.1

      # compile_commands.json — отсюда clang-tidy берёт include-пути и флаги.
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DRAVEL_BUILD_UI=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-Wall -Wextra"

      - name: clang-tidy
        run: >
          .tidy-venv/bin/clang-tidy -p build --warnings-as-errors=*
          $(find core storage app -name '*.cpp')

  # Fuzz: libFuzzer + ASan/UBSan. Санитайзеры через -D (дойти и до линковки,
  # см. комментарий job sanitizers); -fsanitize=fuzzer добавляет только
  # цель ravel_storage_fuzz (fuzz/CMakeLists.txt). Исключения из Load/
  # FromSnapshot на malformed-входе — легальный исход; краш = находка ASan.
  fuzz:
    name: fuzz (Ubuntu · Clang · libFuzzer+ASan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install clang 19 (apt.llvm.org)
        # Стоковый clang ubuntu-latest (18) + libstdc++-14: <expected>
        # не поднимается — std::expected недоступен (первый красный fuzz,
        # 2026-10-22). Clang 19 из официального репозитория LLVM — та же
        # мажорная линейка, что у пинов clang-format/tidy 19.x.
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y clang-19

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DRAVEL_BUILD_UI=OFF
          -DRAVEL_BUILD_FUZZ=ON
          -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      # Корпус посевом из examples/*.ravel.json — мутации от валидного
      # формата находят края глубже, чем мутации от мусора. 120 секунд —
      # компромисс между глубиной и ценой job'а.
      - name: Fuzz (120 s, seeded from examples/)
        run: |
          mkdir fuzz-corpus
          cp examples/*.ravel.json fuzz-corpus/
          ./build/bin/ravel_storage_fuzz fuzz-corpus -max_total_time=120 -print_final_stats=1

      # Краш-артефакты (crash-*, корпус с находкой) — только при падении.
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: |
            fuzz-corpus
            crash-*

