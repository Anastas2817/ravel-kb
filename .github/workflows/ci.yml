# CI: сборка ядра (core + storage + tests) без Qt, матрица платформ и конфигураций.
# UI-слой (Qt 6) намеренно исключён — job `core` по docs/roadmap.md (неделя 3).
#
# MSVC (Windows): warnings-as-errors НЕ включён — системные заголовки nlohmann/json
# дают предупреждения уровня /W4; лечение через /external отложено.
# GCC (Ubuntu): -Wall -Wextra -Werror — свой код должен быть чист; нарушение = красный CI.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  core:
    name: core (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows · MSVC 2022 · Debug"
            os: windows-2022
            generator: "Visual Studio 17 2022"
            extra_flags: "-A x64"
            build_type: Debug
            cxx_flags: ""
          - name: "Windows · MSVC 2022 · Release"
            os: windows-2022
            generator: "Visual Studio 17 2022"
            extra_flags: "-A x64"
            build_type: Release
            cxx_flags: ""
          - name: "Ubuntu · GCC · Debug"
            os: ubuntu-latest
            generator: "Ninja"
            extra_flags: ""
            build_type: Debug
            cxx_flags: "-Wall -Wextra -Werror"
          - name: "Ubuntu · GCC · Release"
            os: ubuntu-latest
            generator: "Ninja"
            extra_flags: ""
            build_type: Release
            cxx_flags: "-Wall -Wextra -Werror"
    # windows-2022 (не latest): на Server 2025 CMake через vswhere не находит VS 2022
    runs-on: ${{ matrix.os }}

    # Через env, а не -DCMAKE_CXX_FLAGS: переменная окружения ПРИБАВЛЯЕТСЯ
    # к флагам по умолчанию, а -DCMAKE_CXX_FLAGS их ЗАМЕНЯЕТ — на MSVC это
    # молча убирает /EHsc (модель исключений) и ломает любой throw → abort.
    env:
      CXXFLAGS: ${{ matrix.cxx_flags }}

    steps:
      - uses: actions/checkout@v4

      # VS-генератор не требует vcvars (в отличие от Ninja из build_dev.bat)
      - name: Configure
        run: >
          cmake -B build -G "${{ matrix.generator }}" ${{ matrix.extra_flags }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRAVEL_BUILD_UI=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
