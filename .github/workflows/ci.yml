# CI: сборка ядра (core + storage + tests) без Qt, матрица платформ и конфигураций.
# UI-слой (Qt 6) намеренно исключён — job `core` по docs/roadmap.md (неделя 3).
#
# MSVC (Windows): warnings-as-errors НЕ включён — системные заголовки nlohmann/json
# дают предупреждения уровня /W4; лечение через /external отложено.
# GCC (Ubuntu): -Wall -Wextra -Werror — свой код должен быть чист; нарушение = красный CI.
# Санитайзеры (ASan+UBSan, отдельный job): ручное индексирование id − 1 по плотным
# векторам — зона повышенного риска off-by-one; санитайзер ловит то, что тесты читают
# как «работает» на отладочной куче.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  core:
    name: core (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows · MSVC 2022 · Debug"
            os: windows-2022
            generator: "Visual Studio 17 2022"
            extra_flags: "-A x64"
            build_type: Debug
            cxx_flags: ""
          - name: "Windows · MSVC 2022 · Release"
            os: windows-2022
            generator: "Visual Studio 17 2022"
            extra_flags: "-A x64"
            build_type: Release
            cxx_flags: ""
          - name: "Ubuntu · GCC · Debug"
            os: ubuntu-latest
            generator: "Ninja"
            extra_flags: ""
            build_type: Debug
            cxx_flags: "-Wall -Wextra -Werror"
          - name: "Ubuntu · GCC · Release"
            os: ubuntu-latest
            generator: "Ninja"
            extra_flags: ""
            build_type: Release
            cxx_flags: "-Wall -Wextra -Werror"
    # windows-2022 (не latest): на Server 2025 CMake через vswhere не находит VS 2022
    runs-on: ${{ matrix.os }}

    # Через env, а не -DCMAKE_CXX_FLAGS: переменная окружения ПРИБАВЛЯЕТСЯ
    # к флагам по умолчанию, а -DCMAKE_CXX_FLAGS их ЗАМЕНЯЕТ — на MSVC это
    # молча убирает /EHsc (модель исключений) и ломает любой throw → abort.
    env:
      CXXFLAGS: ${{ matrix.cxx_flags }}

    steps:
      - uses: actions/checkout@v4

      # VS-генератор не требует vcvars (в отличие от Ninja из build_dev.bat)
      - name: Configure
        run: >
          cmake -B build -G "${{ matrix.generator }}" ${{ matrix.extra_flags }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRAVEL_BUILD_UI=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Пин через venv + pip: бинарь совпадает с локальным из VS 2022 (19.1.5).
      # Версии clang-format форматируют по-разному — пин обязателен, иначе
      # «у меня зелёное, в CI красное». apt-вариант не пинится.
      - name: Install clang-format (pinned 19.1.5)
        run: |
          python3 -m venv .fmt-venv
          .fmt-venv/bin/pip install clang-format==19.1.5

      - name: Check formatting
        run: >
          .fmt-venv/bin/clang-format --dry-run --Werror
          $(find core storage app ui tests -name '*.hpp' -o -name '*.cpp')

  architecture:
    name: architecture (ui не включает graph.hpp напрямую)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Инвариант 7 в машинном виде: ui зависит только от фасада app.
      # Транзитивное включение (ui -> controller.hpp -> graph.hpp) разрешено —
      # проверяется только прямое. Срабатывание на этапе 3 = сигнал
      # расширить read-API Controller, а не ослабить проверку.
      - name: Check ui/ direct includes
        run: bash .github/scripts/check_ui_includes.sh

  # Санитайзеры: ручное индексирование id − 1 по плотным векторам — ровно тот
  # код, где off-by-one читается как «работает» на отладочной куче и взрывается
  # у пользователя. ASan ловит выход за границу и use-after-free, UBSan —
  # UB-арифметику и сдвиги. Цена — один лишний прогон тестов.
  sanitizers:
    name: sanitizers (Ubuntu · GCC · ASan+UBSan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Флаги через -D, а не env CXXFLAGS: санитайзеры обязаны дойти и до
      # компиляции, и до линковки (gtest/тесты). env CXXFLAGS в CMake влияет
      # только на compile-шаг; линковка без -fsanitize дала бы «libasan not
      # linked». Замена флагов по умолчанию здесь безопасна: job только GCC.
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DRAVEL_BUILD_UI=OFF
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
